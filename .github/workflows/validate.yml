name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The card's own tests. The DOM ones matter most: a syntax check cannot
      # catch a call to a function that no longer exists, which is exactly how
      # v0.10.0b3 shipped with no cars on the map at all.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: npm install --no-package-lock
      - name: Card tests
        run: npm test

      # The Python side needs no Home Assistant. prediction.py imports cleanly
      # on its own; for the modules that do import HA, the pure logic is lifted
      # out with ast (see the docstrings in tests/).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Integration tests
        run: |
          python tests/test_prediction.py
          python tests/test_discounts.py
          python tests/test_geocode.py
          python tests/test_card_registration.py
          python tests/test_spoken.py
          python tests/test_nearby.py
      - name: Byte-compile the integration
        run: python -m compileall -q custom_components/tankpriser

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The "brands" check requires the tankpriser domain to be merged
          # into home-assistant/brands, which is a separate PR to that repo.
          # Installing from a custom repository works without it; it is only
          # mandatory to be listed in the HACS default store. Remove this
          # line once the brands PR is merged.
          ignore: brands
