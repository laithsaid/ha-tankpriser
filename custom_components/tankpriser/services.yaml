nearby:
  name: Cheapest stations near a point
  description: >-
    The cheapest stations around a position you supply, with a ready-to-speak
    sentence and navigation links. Returns the answer directly, so a Siri
    Shortcut or an automation can pass the phone's live coordinates and get a
    complete reply from one call — no device tracker, and nothing that can go
    stale in between.
  fields:
    latitude:
      name: Latitude
      description: Where to measure from.
      required: true
      example: 56.1697
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    longitude:
      name: Longitude
      description: Where to measure from.
      required: true
      example: 9.5451
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    fuel:
      name: Fuel
      description: >-
        Which fuel to price. Defaults to the first fuel your Tankpriser area is
        configured for.
      required: false
      example: blyfri95
      selector:
        select:
          options:
            - blyfri95
            - blyfri98
            - blyfri95plus
            - oktan100
            - diesel
            - dieselplus
            - hvo100
    radius_km:
      name: Radius
      description: How far around that point to look.
      required: false
      default: 15
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: km
          mode: box
    maps:
      name: Navigation links
      description: Which map app the returned URLs should open.
      required: false
      default: google
      selector:
        select:
          options:
            - google
            - apple
            - osm

seed_demo_history:
  name: Seed demo prediction history
  description: >-
    Inject synthetic tanks into a car so the fuel-consumption prediction shows a
    number immediately, instead of waiting for real refuel cycles. For
    testing/demo — this overwrites any learned history. Use "Reset history"
    afterwards to go back to real learning.
  fields:
    car:
      name: Car
      description: Only this car (by name). Leave empty to apply to all cars.
      required: false
      example: VW Passat
      selector:
        text:
    tanks:
      name: Tanks
      description: How many synthetic tanks to seed.
      required: false
      default: 3
      selector:
        number:
          min: 2
          max: 10
          mode: box
    litres_per_day:
      name: Litres per day
      description: Simulated consumption rate.
      required: false
      default: 5
      selector:
        number:
          min: 0.5
          max: 50
          step: 0.5
          unit_of_measurement: L/day
          mode: box
    days_per_tank:
      name: Days per tank
      description: Simulated days each tank lasts.
      required: false
      default: 7
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: days
          mode: box

reset_history:
  name: Reset learned history
  description: >-
    Clear a car's learned consumption history, returning its prediction to
    "learning". Useful after changing the tank size or to undo a demo seed.
  fields:
    car:
      name: Car
      description: Only this car (by name). Leave empty to apply to all cars.
      required: false
      example: VW Passat
      selector:
        text:

test_notification:
  name: Test a price notification
  description: >-
    Rehearse a price drop and send the notification it would produce, marked
    "(test)" in the title. Checks the whole chain at once — the rule, the
    threshold and the notify service — instead of waiting for the chains to
    change their prices. Reloading the integration is not a substitute: it
    clears the comparison baseline, so the first refresh after a reload is
    deliberately silent. If nothing can be sent, the reason is reported.
  fields:
    drop_ore:
      name: Pretend drop
      description: >-
        How much cheaper to pretend every station just became, in øre per litre.
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 500
          unit_of_measurement: øre/L
          mode: box

simulate_drive:
  name: Simulate a drive
  description: >-
    Drive a virtual car along a route so the driving features can be tested
    without driving. It writes positions, speed and heading onto a tracker
    entity exactly as the companion app would, so the corridor search, the
    dropping of stations behind you and the spoken answer all run for real —
    nothing is stubbed. Point your Tankpriser area's tracker at the simulated
    entity first, or it will not see the drive.
  fields:
    route:
      name: Route
      description: >-
        A named route to drive. Use this or waypoints, not both.
      required: false
      example: de_north_south
      selector:
        select:
          options:
            - label: Germany, Flensburg to Munich (~830 km)
              value: de_north_south
            - label: Germany, Aachen to Dresden (~640 km)
              value: de_west_east
            - label: Odense to Flensburg and Schleswig (~200 km)
              value: dk_de_border
            - label: Denmark, Skagen to Copenhagen (~470 km)
              value: dk_north_south
    waypoints:
      name: Waypoints
      description: >-
        Your own route, as a list of [latitude, longitude] pairs. Straight
        lines are driven between them, so add one wherever the road turns.
      required: false
      example: "[[54.782, 9.436], [53.551, 9.994]]"
      selector:
        object:
    speed_kmh:
      name: Speed
      description: How fast the car travels. Under 30 km/h counts as parked.
      required: false
      default: 110
      selector:
        number:
          min: 1
          max: 250
          unit_of_measurement: km/h
          mode: box
    interval:
      name: Step interval
      description: >-
        Real seconds between steps. With "ask for an answer" on, every step
        costs a few requests against your API key where the source is queried
        by area — so a short interval on a long route is a lot of requests.
      required: false
      default: 60
      selector:
        number:
          min: 15
          max: 3600
          unit_of_measurement: s
          mode: box
    tracker:
      name: Tracker entity
      description: >-
        Which entity to write the positions to. Defaults to
        device_tracker.tankpriser_sim.
      required: false
      example: device_tracker.tankpriser_sim
      selector:
        text:
    announce:
      name: Ask for an answer at every step
      description: >-
        Call the nearby service from each position and write what it would say
        to the log. Turn this off to move the car without spending requests.
      required: false
      default: true
      selector:
        boolean:
    loop:
      name: Loop
      description: Start again from the beginning on arrival.
      required: false
      default: false
      selector:
        boolean:
    fuel:
      name: Fuel
      description: Which fuel to ask about. Defaults to your first configured one.
      required: false
      example: diesel
      selector:
        text:

stop_simulation:
  name: Stop the simulated drive
  description: >-
    Stop the running simulation and leave the car parked where it got to, with
    its speed set to zero so nothing goes on believing it is moving.

prediction_accuracy:
  name: Grade the fuel prediction
  description: >-
    Scores the consumption prediction against what each car actually did, tank
    by tank, using only the tanks that came before each one. Says whether the
    model is consistently off in one direction or merely noisy. Only exists
    while "Grade the fuel prediction against reality" is switched on under
    Configure → Area & fuel types.
  fields:
    car:
      name: Car
      description: Grade one car by name. Leave empty to grade them all.
      required: false
      example: Passat
      selector:
        text:
